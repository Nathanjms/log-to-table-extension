<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'nonce-${nonce}'; script-src 'nonce-${nonce}'; base-uri 'none'; form-action 'none';"
    >
    <title>Log Viewer</title>
    <style nonce="${nonce}">${styles}</style>
    <script nonce="${nonce}" src="${logViewerUri}" defer></script>
    <script nonce="${nonce}" src="${alpineUri}" defer></script>
  </head>
  <body>
    <main class="viewer-shell" x-data="logViewer">
      <header class="viewer-header">
        <div>
          <span class="eyebrow">Log viewer</span>
          <h1>Log entries</h1>
          <p>Newest entries first. Filter the loaded portion of the file without changing its contents.</p>
        </div>
        <div class="header-stats" aria-live="polite">
          <span class="stat"><strong x-text="filteredLogs.length"></strong> shown</span>
          <span class="stat"><strong x-text="logs.length"></strong> loaded</span>
        </div>
      </header>

      <template x-if="!loading && !loadingError && hasMore">
        <aside class="notice" role="status">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M12 9v4m0 4h.01M10.3 3.8 2.4 17.5A2 2 0 0 0 4.1 20h15.8a2 2 0 0 0 1.7-2.5L13.7 3.8a2 2 0 0 0-3.4 0Z" />
          </svg>
          <span>
            Showing the final <strong x-text="bytesToHumanReadable(limitInBytes)"></strong> of this
            <strong x-text="bytesToHumanReadable(fileSize)"></strong> file.
          </span>
        </aside>
      </template>

      <template x-if="!loading && !loadingError && !hasNoLogs && regex.test && !regex.patterns[regex.test]">
        <section class="panel save-format-panel">
          <div>
            <h2>Custom format matched</h2>
            <p>Name this format to reuse it in other log files.</p>
          </div>
          <form class="inline-form" @submit.prevent="saveTestRegex()">
            <label class="sr-only" for="regex-name">Format name</label>
            <input id="regex-name" type="text" placeholder="Format name" x-model="regex.testName">
            <button class="primary" x-bind:disabled="!regex.testName || loading" type="submit">Save format</button>
            <button class="secondary" type="button" @click="regex.test = ''">Dismiss</button>
          </form>
        </section>
      </template>

      <section class="panel filter-panel" aria-labelledby="filter-heading">
        <div class="panel-heading">
          <div>
            <h2 id="filter-heading">Filters</h2>
            <p>Search within the entries currently loaded.</p>
          </div>
          <button class="secondary compact" type="button" x-bind:disabled="noFiltersApplied || loading" @click="clearFilters()">
            Clear filters
          </button>
        </div>

        <form class="filter-grid" @submit.prevent="applyFilters">
          <label class="field">
            <span>Timestamp</span>
            <input x-bind:disabled="loading" type="text" placeholder="2026-08-22" x-model="filters.timestamp">
          </label>
          <label class="field">
            <span>Severity</span>
            <select x-bind:disabled="loading" x-model="filters.severity">
              <option value="">All severities</option>
              <template x-for="severity in severities" :key="severity">
                <option x-text="severity"></option>
              </template>
            </select>
          </label>
          <label class="field field-message">
            <span>Message</span>
            <input x-bind:disabled="loading" type="text" placeholder="Search message text" x-model="filters.message">
          </label>
          <div class="filter-actions">
            <button class="primary" x-bind:disabled="loading" type="submit">Apply filters</button>
            <button
              class="icon-button"
              x-bind:disabled="loading"
              type="button"
              @click="refresh({ pattern: regex.set })"
              title="Refresh log file"
              aria-label="Refresh log file"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M20 11a8.1 8.1 0 0 0-14.9-4M4 4v5h5m-5 4a8.1 8.1 0 0 0 14.9 4M20 20v-5h-5" />
              </svg>
            </button>
          </div>
        </form>
      </section>

      <template x-if="loading">
        <section class="state-panel" aria-live="polite">
          <div class="spinner" aria-hidden="true"></div>
          <h2>Loading log entries</h2>
          <p>Reading and parsing the latest file contents.</p>
        </section>
      </template>

      <template x-if="!loading && loadingError">
        <section class="state-panel error-state" role="alert">
          <div class="state-icon">!</div>
          <h2>Could not load this log</h2>
          <p x-text="loadingError"></p>
          <button class="secondary" type="button" @click="refresh({ pattern: regex.set })">Try again</button>
        </section>
      </template>

      <template x-if="!loading && !loadingError && !hasNoLogs">
        <section class="results" aria-label="Log entries">
          <div class="results-toolbar">
            <p>
              <strong x-text="filteredLogs.length"></strong>
              <span x-text="filteredLogs.length === 1 ? 'entry' : 'entries'"></span>
            </p>
            <label class="page-size">
              <span>Rows per page</span>
              <select x-model.number="pageSize" @change="setPageSize()">
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </label>
          </div>

          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th class="timestamp-column">Timestamp</th>
                  <th class="severity-column">Severity</th>
                  <th>Message</th>
                  <th class="actions-column"><span class="sr-only">Actions</span></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(log, idx) in pageLogs" :key="idx">
                  <tr>
                    <td class="timestamp-cell" data-label="Timestamp" x-text="log.timestamp"></td>
                    <td data-label="Severity">
                      <span class="severity-badge" x-bind:class="severityClass(log.severity)" x-text="log.severity"></span>
                    </td>
                    <td class="message-cell" data-label="Message">
                      <span x-text="formatMessage(log.text)"></span>
                    </td>
                    <td class="row-actions" data-label="Actions">
                      <div class="row-action-buttons">
                        <button class="icon-button ghost" type="button" @click="openModal(log.text)" title="Show full message" aria-label="Show full message">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                            <path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5M3 8l6-5m6 0 6 5M3 16l6 5m6 0 6-5" />
                          </svg>
                        </button>
                        <button class="icon-button ghost" type="button" x-bind:disabled="copy.isLoading" @click="copyToClipboard(log.text)" title="Copy message" aria-label="Copy message">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                            <path d="M9 8h10v12H9zM5 16H4V4h10v1" />
                          </svg>
                        </button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <nav class="pagination" aria-label="Log pages">
            <button class="secondary compact" type="button" @click="firstPage()" x-bind:disabled="page === 1">First</button>
            <button class="secondary compact" type="button" @click="prevPage()" x-bind:disabled="page === 1">Previous</button>
            <span class="page-status">Page <strong x-text="page"></strong> of <strong x-text="totalPages"></strong></span>
            <button class="secondary compact" type="button" @click="nextPage()" x-bind:disabled="page === totalPages">Next</button>
            <button class="secondary compact" type="button" @click="lastPage()" x-bind:disabled="page === totalPages">Last</button>
          </nav>
        </section>
      </template>

      <template x-if="!loading && !loadingError && hasNoLogs && !noFiltersApplied">
        <section class="state-panel">
          <div class="state-icon search-icon">?</div>
          <h2>No matching entries</h2>
          <p>Try broadening the timestamp, severity, or message filters.</p>
          <button class="secondary" type="button" @click="clearFilters()">Clear filters</button>
        </section>
      </template>

      <template x-if="!loading && !loadingError && hasNoLogs && noFiltersApplied">
        <section class="panel format-panel">
          <div class="format-intro">
            <span class="eyebrow">No entries matched</span>
            <h2>Choose another log format</h2>
            <p>The file may not use Laravel's default format. Apply a saved pattern or test a custom regular expression.</p>
          </div>

          <template x-if="hasSavedPatterns">
            <div class="saved-formats">
              <h3>Saved formats</h3>
              <div class="saved-format-list">
                <template x-for="(name, pattern) in regex.patterns" :key="pattern">
                  <div class="saved-format-row">
                    <span x-text="name"></span>
                    <div>
                      <button class="secondary compact" type="button" @click="changeFormat(pattern)">Apply</button>
                      <button class="ghost danger compact" type="button" @click="deletePattern(pattern)">Delete</button>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <form class="regex-form" @submit.prevent="changeFormat()">
            <label class="field">
              <span>Custom regex</span>
              <input type="text" placeholder="^(?<timestamp>...),..." x-model="regex.test">
            </label>
            <button class="primary" x-bind:disabled="!regex.test || loading" type="submit">Test format</button>
          </form>
          <p class="form-help">
            Requires named groups for <code>timestamp</code>, <code>severity</code>, and <code>text</code>.
            <a href="https://github.com/Nathanjms/log-to-table-extension/issues/new">Get help on GitHub</a>.
          </p>
        </section>
      </template>

      <dialog aria-labelledby="dialog-title">
        <div class="modal-content">
          <div class="modal-toolbar">
            <div>
              <span class="eyebrow">Selected entry</span>
              <h2 id="dialog-title">Full message</h2>
            </div>
            <button class="icon-button ghost" type="button" @click="closeModal()" title="Close" aria-label="Close dialog">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
          </div>
          <div class="modal-actions">
            <button class="secondary compact" type="button" x-bind:disabled="copy.isLoading" @click="copyToClipboard(modal.text)">Copy message</button>
            <button class="secondary compact" type="button" @click="toggleWrap()" aria-label="Toggle message wrapping">
              <span x-text="modal.wrap ? 'Disable wrap' : 'Enable wrap'"></span>
            </button>
          </div>
          <pre class="code" x-bind:class="{wrap: modal.wrap}" x-text="modal.text"></pre>
        </div>
      </dialog>
    </main>
  </body>
</html>
